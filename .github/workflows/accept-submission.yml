# When a maintainer adds the "accepted" label to a paper or group submission,
# add it to the site's data files, commit, comment and close the issue.
name: Accept submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: accept-submission
  cancel-in-progress: false

jobs:
  accept:
    if: github.event.label.name == 'accepted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add submission to data files
        env:
          RESULT_FILE: ${{ runner.temp }}/result.json
        run: python .github/scripts/accept_submission.py

      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "sig-ilsp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Add submission from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_FILE: ${{ runner.temp }}/result.json
          ISSUE: ${{ github.event.issue.number }}
        run: |
          MSG=$(python -c "import json,os;print(json.load(open(os.environ['RESULT_FILE']))['message'])")
          OK=$(python -c "import json,os;print(json.load(open(os.environ['RESULT_FILE']))['ok'])")
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$MSG"
          if [ "$OK" = "True" ]; then
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
          else
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label accepted
          fi
